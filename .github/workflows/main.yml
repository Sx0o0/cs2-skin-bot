name: CS2 Skin Bot Avançado

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas matplotlib

      - name: Run CS2 Skin Bot
        run: python cs2_skin_bot.py

      - name: Create ranking script
        run: |
          echo "import pandas as pd" > generate_ranking.py
          echo "import matplotlib.pyplot as plt" >> generate_ranking.py
          echo "df = pd.read_csv('skin_history.csv')" >> generate_ranking.py
          echo "if not df.empty and 'Score' in df.columns:" >> generate_ranking.py
          echo "    df_sorted = df.sort_values('Score', ascending=False)" >> generate_ranking.py
          echo "    plt.figure(figsize=(10,6))" >> generate_ranking.py
          echo "    plt.barh(df_sorted['Skin'], df_sorted['Score'])" >> generate_ranking.py
          echo "    plt.xlabel('Score')" >> generate_ranking.py
          echo "    plt.title('Ranking de Valorização CS2')" >> generate_ranking.py
          echo "    plt.savefig('ranking.png')" >> generate_ranking.py

      - name: Generate Ranking & Graph
        run: python generate_ranking.py

      - name: Commit updated files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Atualiza ranking e histórico" || echo "Nada para commit"
          git push
