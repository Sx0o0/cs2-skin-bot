      - name: Generate Ranking & Graph
        run: |
          python - <<EOF
import pandas as pd
import matplotlib.pyplot as plt

try:
    df = pd.read_csv('skin_history.csv')
except FileNotFoundError:
    df = pd.DataFrame(columns=['Skin','Preco','Volume','Score'])

if not df.empty:
    df_sorted = df.sort_values('Score', ascending=False)
    plt.figure(figsize=(10,6))
    plt.barh(df_sorted['Skin'], df_sorted['Score'], color='green')
    plt.xlabel('Score')
    plt.title('Ranking de Valorização CS2')
    plt.savefig('ranking.png')
EOF
